[package]
name = "vision"
version.workspace = true
edition.workspace = true

[dependencies]
image = { version = "0.25.10", default-features = false, features = ["png"] }
ocr = { path = "../ocr" }
ort = { version = "=2.0.0-rc.15", features = ["directml"] }
scanner = { path = "../scanner" }
# Smallest feature set for loading a local `tokenizer.json` (no `http`, no `hf-hub`, no `progressbar`).
tokenizers = { version = "=0.23.2", default-features = false }

[dev-dependencies]
ab_glyph = "0.2.32"
serde_json = "1.0.154"
tempfile = "3.27.0"

[target."cfg(windows)".dev-dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_LibraryLoader", "Win32_System_ProcessStatus", "Win32_System_Threading"] }
