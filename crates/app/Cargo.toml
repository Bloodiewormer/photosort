[package]
name = "app"
version.workspace = true
edition.workspace = true

[[bin]]
name = "hojeo"
path = "src/main.rs"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dependencies]
catalog = { path = "../catalog" }
eframe = "0.37.0"
export = { path = "../export" }
fsguard = { path = "../fsguard" }
image = "0.25.10"
ocr = { path = "../ocr" }
raw-window-handle = "0.6"
rfd = "0.18.0"
rules = { path = "../rules" }
scanner = { path = "../scanner" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
thumbs = { path = "../thumbs" }
vision = { path = "../vision" }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem", "Win32_System_ProcessStatus", "Win32_System_Threading"] }

[dev-dependencies]
dunce = "1.0.5"
walkdir = "2.5.1"
